<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif">
  <text x="200" y="18" text-anchor="middle" font-size="14">Acme Cloud Quarterly Revenue 2025 (USD millions)</text>
  <line x1="60" y1="260" x2="380" y2="260" stroke="black"/>
  <line x1="60" y1="20" x2="60" y2="260" stroke="black"/>
  <g stroke="#ccc">
    <line x1="60" y1="260" x2="380" y2="260"/>
    <line x1="60" y1="200" x2="380" y2="200"/>
    <line x1="60" y1="140" x2="380" y2="140"/>
    <line x1="60" y1="80" x2="380" y2="80"/>
    <line x1="60" y1="20" x2="380" y2="20"/>
  </g>
  <g font-size="10" text-anchor="end" dominant-baseline="central">
    <text x="55" y="260">0</text>
    <text x="55" y="200">20</text>
    <text x="55" y="140">40</text>
    <text x="55" y="80">60</text>
    <text x="55" y="20">80M</text>
  </g>
  <g fill="#4a90d9">
    <rect class="bar" data-quarter="Q1" x="90" y="132.5" width="50" height="127.5"/>
    <rect class="bar" data-quarter="Q2" x="170" y="85.1" width="50" height="174.9"/>
    <rect class="bar" data-quarter="Q3" x="250" y="116.3" width="50" height="143.7"/>
    <rect class="bar" data-quarter="Q4" x="330" y="70.4" width="50" height="189.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="115" y="276">Q1</text>
    <text x="195" y="276">Q2</text>
    <text x="275" y="276">Q3</text>
    <text x="355" y="276">Q4</text>
  </g>
</svg>
